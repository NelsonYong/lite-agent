# 用药提醒配置模板 (Medication Reminder Configuration Template)

version: "1.0"
templateName: 用药提醒系统
description: 帮助患者管理日常用药，确保按时按量服药

# 患者基本信息
patientInfo:
  patientId: ""
  patientName: ""
  age: 0
  conditions:
    - ""  # 疾病列表

# 用药清单
medications:
  - medicationId: "med001"
    name: "阿莫西林胶囊"
    genericName: "Amoxicillin"
    dosage: "500mg"
    form: "胶囊"
    indication: "细菌性呼吸道感染"

    schedule:
      frequency: "每日3次"
      times:
        - "08:00"
        - "14:00"
        - "20:00"
      timing: "餐后30分钟"
      duration: "7天"
      startDate: "2026-01-13"
      endDate: "2026-01-20"

    instructions:
      - "用足量水送服"
      - "完成全疗程，不可中途停药"
      - "如出现皮疹立即停药并就医"

    precautions:
      - "青霉素过敏者禁用"
      - "可能出现腹泻、恶心等不适"

    interactions:
      - drug: "口服避孕药"
        effect: "可能降低避孕效果"

  - medicationId: "med002"
    name: "氨氯地平片"
    genericName: "Amlodipine"
    dosage: "5mg"
    form: "片剂"
    indication: "高血压"

    schedule:
      frequency: "每日1次"
      times:
        - "08:00"
      timing: "晨起空腹"
      duration: "长期"
      startDate: "2026-01-01"
      endDate: null  # 长期用药无结束日期

    instructions:
      - "固定时间服用，保持血压稳定"
      - "不可自行停药或调整剂量"
      - "定期监测血压"

    precautions:
      - "可能出现踝部水肿、头痛"
      - "起身时动作缓慢，防止直立性低血压"

    monitoring:
      - type: "血压"
        frequency: "每日早晚各1次"
        targetRange: "<140/90 mmHg"

  - medicationId: "med003"
    name: "二甲双胍片"
    genericName: "Metformin"
    dosage: "500mg"
    form: "片剂"
    indication: "2型糖尿病"

    schedule:
      frequency: "每日2次"
      times:
        - "08:00"
        - "18:00"
      timing: "随餐或餐后"
      duration: "长期"
      startDate: "2025-06-01"
      endDate: null

    instructions:
      - "随餐服用，减少胃肠道反应"
      - "从低剂量开始，逐渐增加"
      - "监测血糖变化"

    precautions:
      - "可能出现恶心、腹泻（通常2周内缓解）"
      - "严重肾功能不全禁用"
      - "定期检查肾功能和维生素B12水平"

    monitoring:
      - type: "空腹血糖"
        frequency: "每周2-3次"
        targetRange: "4.4-7.0 mmol/L"
      - type: "HbA1c"
        frequency: "每3个月"
        targetRange: "<7.0%"

# 用药提醒设置
reminderSettings:
  enabled: true
  advanceNoticeDuration: "15分钟"  # 提前15分钟提醒
  snoozeOptions:
    - "5分钟"
    - "15分钟"
    - "30分钟"
  missedDoseAlert: true
  missedDoseThreshold: "2小时"  # 超过2小时未服药发出警告

# 服药记录模板
adherenceLog:
  - date: "2026-01-13"
    medicationId: "med001"
    scheduledTime: "08:00"
    actualTime: "08:10"
    status: "已服用"
    notes: ""

  - date: "2026-01-13"
    medicationId: "med002"
    scheduledTime: "08:00"
    actualTime: null
    status: "漏服"
    notes: "忘记服药"
    action: "与主管医生联系咨询是否补服"

# 补服规则
missedDoseGuidelines:
  - condition: "漏服时间 < 2小时"
    action: "立即补服"

  - condition: "漏服时间 2-6小时"
    action: "如果距离下次服药时间 >2小时，可补服；否则跳过本次，等待下次服药"

  - condition: "漏服时间 > 6小时"
    action: "跳过本次，按原计划继续，不可加倍剂量"

  - condition: "长期用药（高血压、糖尿病）漏服"
    action: "联系医生或药师咨询"

# 药品储存
storageInstructions:
  temperature: "室温（15-25°C）"
  conditions:
    - "避光保存"
    - "防潮干燥"
    - "儿童不可触及的地方"
  expiryDateCheck: "定期检查有效期"

# 复诊提醒
followUpReminders:
  - type: "慢性病复诊"
    frequency: "每3个月"
    nextAppointment: "2026-04-13"
    location: "心内科门诊"
    purpose: "评估血压控制情况，调整用药"

  - type: "实验室检查"
    frequency: "每6个月"
    nextAppointment: "2026-07-13"
    tests:
      - "肝功能"
      - "肾功能"
      - "血糖"
      - "HbA1c"

# 紧急联系方式
emergencyContacts:
  - role: "主管医生"
    name: "张医生"
    phone: "138-xxxx-xxxx"
    availability: "工作日 09:00-17:00"

  - role: "药师咨询"
    phone: "医院药学门诊"
    availability: "工作日 08:00-12:00, 14:00-17:00"

  - role: "急诊"
    phone: "120"
    note: "出现严重不良反应或急症时拨打"

# 用药教育资源
educationResources:
  - topic: "高血压用药注意事项"
    content: "长期规律服药，不可自行停药；监测血压；保持健康生活方式"

  - topic: "糖尿病用药管理"
    content: "按时服药，监测血糖；低血糖处理方法；饮食运动配合"

  - topic: "抗生素合理使用"
    content: "完成全疗程；不可随意增减剂量；注意过敏反应"

# 配置元数据
metadata:
  version: "1.0"
  createdDate: "2026-01-13"
  lastUpdated: "2026-01-13"
  author: "AGUI Medical Team"
